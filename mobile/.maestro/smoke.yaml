# P0-05 E2E smoke flow for the Phase 1 prototype.
# Runs against Expo Go for now (no store identifiers are decided yet). Switch `appId` to the
# development-build id once the product name / bundle id are final.
#
# WARNING: this flow REPLACES the saved data on the device with the sample data (Settings > Load sample data).
# Run it only on a test phone or emulator, on a fresh install (the first-run questions appear once).
#
# It tests the app on its own: there must be NO mobile/.env.local (no sign-in screens). Sign-in and sharing are covered
# by the automated tests (npm test) and by docs/TEST-WITH-TWO-ACCOUNTS.md.
#
# Run (see docs/TESTING.md):
#   1. cd mobile && npm start            # open the project in Expo Go on the emulator/device
#   2. maestro test .maestro/smoke.yaml
appId: host.exp.exponent
---
- launchApp:
    clearState: false
# Open the running dev server from Expo Go's home screen if it is not already in the foreground.
- assertVisible:
    id: 'home-screen'
- assertVisible: 'UAE Cash-Flow Planner'

# Welcome -> the savings questions (zero is allowed for both answers)
- tapOn:
    id: 'start-button'
- assertVisible:
    id: 'setup-screen'
- tapOn:
    id: 'setup-save'

# A new user starts with an empty Income page and an Add item button
- assertVisible:
    id: 'income-screen'
- assertVisible: 'No income added yet'
- assertVisible: 'Add item'

# Load the demo data from Settings (on the Dashboard)
- tapOn:
    id: 'tab-dashboard'
- tapOn:
    id: 'open-settings'
- tapOn:
    id: 'load-sample'
- assertVisible: 'Sample data loaded.'
- back

# Dashboards open with charts; the hand-verified safe-to-spend card is lower on the Overview
- assertVisible:
    id: 'dashboard-screen'
- assertVisible:
    id: 'dash-section-overview'
- assertVisible:
    id: 'chart-in-out'
- scrollUntilVisible:
    element:
      id: 'safe-to-spend-card'
- assertVisible: 'AED 1,770.00'

# Every section has its own dashboard
- scrollUntilVisible:
    element:
      id: 'dash-section-spending'
    direction: UP
- tapOn:
    id: 'dash-section-spending'
- assertVisible:
    id: 'spending-dashboard'
- tapOn:
    id: 'dash-section-savings'
- assertVisible:
    id: 'savings-dashboard'
- tapOn:
    id: 'dash-section-overview'

# Explanation is reachable from the headline number
- scrollUntilVisible:
    element:
      id: 'metric-safe'
- tapOn:
    id: 'metric-safe'
- assertVisible: 'What went in'
- back

# What-if shows a shortfall and leaves the real plan alone
- scrollUntilVisible:
    element:
      id: 'open-scenario'
- tapOn:
    id: 'open-scenario'
- tapOn:
    id: 'scenario-toggle'
- assertVisible:
    id: 'scenario-result'
