version: 2
updates:
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Expo SDK 57 pins exact versions of react, react-dom, react-test-renderer and react-native,
    # and expects SDK-matched versions of expo-* and the native libraries below. Bumping them
    # independently breaks `npm ci` (peer conflicts) and the SDK. Upgrade them together with the
    # Expo SDK via `npx expo install --fix` instead. See ADR 0002.
    ignore:
      - dependency-name: expo
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-test-renderer
      - dependency-name: react-native
      - dependency-name: react-native-screens
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: react-native-safe-area-context
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Toolchain majors are deliberate, tested upgrades (not automatic PRs).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
