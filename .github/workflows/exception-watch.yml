name: Security exception watch

# Weekly reminder: opens (or comments on) a GitHub issue assigned to the owner when a risk-accepted
# dependency exception needs attention (a fix exists, or it is about to expire / has expired).
on:
  schedule:
    - cron: '0 5 * * 1' # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification (creates a test issue)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check exceptions and notify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Evaluate exceptions
        id: eval
        env:
          TEST_MODE: ${{ inputs.test && '1' || '0' }}
        run: |
          node mobile/scripts/exception-watch.js > "$RUNNER_TEMP/watch.txt"
          if [ -s "$RUNNER_TEMP/watch.txt" ]; then echo "needs_attention=true" >> "$GITHUB_OUTPUT"; fi
          cat "$RUNNER_TEMP/watch.txt"
      - name: Open or update the reminder issue
        if: steps.eval.outputs.needs_attention == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          TITLE="Security exception needs attention"
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/watch.txt"
          else
            gh issue create --title "$TITLE" --assignee "$OWNER" --body-file "$RUNNER_TEMP/watch.txt"
          fi
